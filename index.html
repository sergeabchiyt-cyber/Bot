<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B0E11" />
  <title>XAUUSD Terminal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="dot-live"></span>
      <span class="brand-name">XAUUSD</span>
      <span class="brand-live">LIVE</span>
    </div>
    <div class="price-wrap">
      <span id="last-price">—</span>
      <span class="sentiment-pill">
        SENTIMENT&nbsp;<span id="sentiment-value">—</span>
      </span>
    </div>
  </header>

  <nav class="tfbar">
    <div class="tf-tabs">
      <button class="tf active" data-tf="15m">15M</button>
      <button class="tf" data-tf="1h">1H</button>
      <button class="tf" data-tf="1d">1D</button>
    </div>

    <div class="legend">
      <span class="legend-item"><i class="legend-line" style="border-color:#F0B90B"></i>PW PoC</span>
      <span class="legend-item"><i class="legend-line" style="border-color:#26A69A"></i>PW VaH</span>
      <span class="legend-item"><i class="legend-line" style="border-color:#EF5350"></i>PW VaL</span>
      <span class="legend-item"><i class="legend-line" style="border-color:#58A6FF"></i>PS PoC</span>
      <span class="legend-item"><i class="legend-line" style="border-color:#A371F7"></i>CW PoC</span>
      <span class="legend-item"><i class="legend-line" style="border-color:#F778BA"></i>CW VaH</span>
      <span class="legend-item"><i class="legend-line" style="border-color:#22D3EE"></i>CW VaL</span>
    </div>

    <span id="status" class="status">—</span>
  </nav>

  <main class="layout">
    <div id="chart"></div>

    <aside class="sidebar">
      <section class="panel">
        <header class="panel-head">
          <span class="panel-title">LEVELS</span>
          <span id="levels-count" class="panel-count">0</span>
        </header>
        <div id="levels-list" class="panel-body">
          <div class="empty">Awaiting data…</div>
        </div>
      </section>

      <section class="panel">
        <header class="panel-head">
          <span class="panel-title">ORDER FLOW</span>
          <span id="bubbles-count" class="panel-count">0</span>
        </header>
        <div id="bubbles-list" class="panel-body">
          <div class="empty">No bubbles detected</div>
        </div>
      </section>

      <section class="panel">
        <header class="panel-head">
          <span class="panel-title">CALENDAR</span>
          <span id="calendar-count" class="panel-count">0</span>
        </header>
        <div id="calendar-list" class="panel-body">
          <div class="empty">No events loaded</div>
        </div>
      </section>
    </aside>
  </main>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="bubbles.js"></script>
  <script src="chart.js"></script>
</body>
</html>
