<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0E11" />
  <title>XAUUSD ORDERFLOW Terminal</title>
  <style>
    :root {
      --bg:#0B0E11; --bg1:#0D1117; --bg2:#11151A; --border:rgba(255,255,255,.06);
      --text:#E6EDF3; --muted:#7D8590; --dim:#4D5560;
      --buy:#22c55e; --sell:#ef4444; --absb:#3b82f6; --abss:#f97316;
      --pw:#facc15; --ps:#fb923c; --cw:#22d3ee;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:12px; overflow:hidden; }
    body { display:flex; flex-direction:column; height:100dvh; }
    .topbar,.tfbar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg1); border-bottom:1px solid var(--border); }
    .topbar { justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:6px; font-weight:600; letter-spacing:.04em; }
    .dot { width:6px; height:6px; border-radius:50%; background:var(--buy); box-shadow:0 0 6px var(--buy); }
    #last-price { font-variant-numeric:tabular-nums; font-weight:600; font-size:16px; }
    .tfbar { overflow-x:auto; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 12px; color:var(--muted); font-size:10px; }
    .sw { display:inline-block; width:10px; height:2px; vertical-align:middle; margin-right:4px; }
    .status { margin-left:auto; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
    .chips { display:flex; flex-wrap:wrap; gap:4px; padding:6px 12px; background:var(--bg1); border-bottom:1px solid var(--border); }
    .chip { font-size:9px; letter-spacing:.04em; padding:2px 7px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
    .chip.ok { color:#22c55e; border-color:#22c55e55; }
    .chip.warn { color:#facc15; border-color:#facc1555; }
    .chip.err { color:#ef4444; border-color:#ef444455; }
    .chip.off { color:var(--dim); }
    .layout { flex:1; display:flex; min-height:0; }
    #chart { flex:1; min-width:0; position:relative; }
    canvas { display:block; width:100%; height:100%; }
    .sidebar { width:180px; background:var(--bg1); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:auto; }
    .panel { border-bottom:1px solid var(--border); }
    .panel-head { display:flex; justify-content:space-between; padding:6px 8px; background:var(--bg2); font-size:9px; letter-spacing:.1em; color:var(--muted); font-weight:600; position:sticky; top:0; }
    .panel-count { background:rgba(255,255,255,.04); padding:1px 6px; border-radius:8px; }
    .empty { padding:8px; color:var(--dim); font-style:italic; font-size:10px; }
    .level-row,.bubble-row,.event-row { padding:4px 8px; font-size:10px; border-bottom:1px solid rgba(255,255,255,.02); display:flex; justify-content:space-between; gap:6px; }
    .event-impact { font-size:8px; padding:1px 5px; border-radius:3px; text-transform:uppercase; font-weight:600; }
    .impact-high { background:rgba(239,68,68,.15); color:#ef4444; }
    .impact-medium { background:rgba(249,115,22,.15); color:#f97316; }
    .impact-low { background:rgba(250,204,21,.12); color:#facc15; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>XAUUSD ORDERFLOW <span style="color:var(--muted);font-weight:400">15M</span></div>
    <div id="last-price">—</div>
  </header>
  <nav class="tfbar">
    <div class="legend">
      <span><i class="sw" style="background:#facc15"></i>PW</span>
      <span><i class="sw" style="background:#fb923c"></i>PS</span>
      <span><i class="sw" style="background:#22d3ee"></i>CW</span>
      <span style="color:#22c55e">BUY</span>
      <span style="color:#ef4444">SELL</span>
      <span style="color:#3b82f6">ABS BUY</span>
      <span style="color:#f97316">ABS SELL</span>
    </div>
    <span id="conn" class="status">connecting</span>
  </nav>
  <div id="chips" class="chips"></div>
  <main class="layout">
    <div id="chart"><canvas id="cv"></canvas></div>
    <aside class="sidebar">
      <section class="panel">
        <header class="panel-head">LEVELS <span id="levels-count" class="panel-count">0</span></header>
        <div id="levels-list" class="empty">Awaiting data…</div>
      </section>
      <section class="panel">
        <header class="panel-head">ORDER FLOW <span id="bubbles-count" class="panel-count">0</span></header>
        <div id="bubbles-list" class="empty">No bubbles detected</div>
      </section>
      <section class="panel">
        <header class="panel-head">CALENDAR <span id="calendar-count" class="panel-count">0</span></header>
        <div id="calendar-list" class="empty">No events loaded</div>
      </section>
    </aside>
  </main>
<script>
const BACKEND = window.ENGINE_URL || location.origin;
const BUBBLE_COLORS = { BUY_BUBBLE:'#22c55e', SELL_BUBBLE:'#ef4444', ABS_BUY:'#3b82f6', ABS_SELL:'#f97316' };
const BUBBLE_LABEL = { BUY_BUBBLE:'BUY', SELL_BUBBLE:'SELL', ABS_BUY:'ABS-B', ABS_SELL:'ABS-S' };
const WIN_COLOR = { PW:'#facc15', PS:'#fb923c', CW:'#22d3ee' };

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('chart');

const candles = []; // {time,open,high,low,close,volume,source}
const candleByTime = new Map();
const levels = { PW:null, PS:null, CW:null };
const bubbles = [];
const MAX_CANDLES = 500;
const MAX_BUBBLES = 80;
let feeds = {};
let lastPrice = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = Math.max(1, Math.floor(w * dpr));
  canvas.height = Math.max(1, Math.floor(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(wrap);

function upsertCandle(c) {
  if (!c || !c.time) return;
  const src = c.source || '';
  const prev = candleByTime.get(c.time);
  if (prev && prev.source === 'binance' && src && src !== 'binance') return;
  candleByTime.set(c.time, c);
  const i = candles.findIndex(x => x.time === c.time);
  if (i >= 0) candles[i] = c; else candles.push(c);
  candles.sort((a,b) => a.time - b.time);
  while (candles.length > MAX_CANDLES) {
    const drop = candles.shift();
    candleByTime.delete(drop.time);
  }
  lastPrice = c.close;
  document.getElementById('last-price').textContent = Number(c.close).toFixed(2);
}

function draw() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  ctx.clearRect(0,0,w,h);
  if (!candles.length) return;
  const padL = 8, padR = 56, padT = 10, padB = 22;
  const vis = candles.slice(-180);
  let lo = Infinity, hi = -Infinity;
  for (const c of vis) { lo = Math.min(lo, c.low); hi = Math.max(hi, c.high); }
  for (const k of ['PW','PS','CW']) {
    const l = levels[k]; if (!l) continue;
    lo = Math.min(lo, l.val, l.poc); hi = Math.max(hi, l.vah, l.poc);
  }
  if (!(hi > lo)) { hi = lo + 1; }
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const slot = plotW / vis.length;
  const yOf = p => padT + (hi - p) / (hi - lo) * plotH;
  const xOf = i => padL + (i + 0.5) * slot;

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = padT + plotH * g / 4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
  }

  vis.forEach((c,i) => {
    const x = xOf(i);
    const up = c.close >= c.open;
    ctx.strokeStyle = up ? '#26A69A' : '#EF5350';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.moveTo(x, yOf(c.high)); ctx.lineTo(x, yOf(c.low)); ctx.stroke();
    const y1 = yOf(Math.max(c.open,c.close)), y2 = yOf(Math.min(c.open,c.close));
    const bw = Math.max(1, slot * 0.6);
    ctx.fillRect(x - bw/2, y1, bw, Math.max(1, y2-y1));
  });

  function line(price, color, dashed) {
    if (!price) return;
    const y = yOf(price);
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = dashed ? 1 : 1.5;
    if (dashed) ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.font = '10px Inter,sans-serif';
    ctx.fillText(price.toFixed(2), w-padR+4, y+3);
    ctx.restore();
  }
  for (const k of ['PW','PS','CW']) {
    const l = levels[k]; if (!l) continue;
    const col = WIN_COLOR[k];
    line(l.poc, col, false);
    if (k !== 'PS') { line(l.vah, col, true); line(l.val, col, true); }
  }

  const now = Date.now();
  bubbles.forEach(ev => {
    const t = ev.timestamp > 1e12 ? ev.timestamp : ev.timestamp * 1000;
    const age = now - t;
    if (age > 15 * 60 * 1000) return;
    const idx = vis.findIndex(c => Math.abs(c.time - (t > 1e12 ? Math.floor(t/1000)*1000===c.time?c.time:c.time : t)) < 15*60*1000);
    // map bubble time to nearest candle
    const tsMs = ev.timestamp > 1e12 ? ev.timestamp : ev.timestamp * 1000;
    let bi = vis.length - 1;
    for (let i = 0; i < vis.length; i++) {
      if (vis[i].time + 15*60*1000 > tsMs) { bi = i; break; }
    }
    const x = xOf(bi);
    const y = yOf(ev.level);
    const maxS = Math.max(100, ...bubbles.map(b => b.strength||0));
    const r = 3 + Math.min(1, (ev.strength||0)/maxS) * 12;
    const alpha = Math.max(0.15, 1 - age / (15*60*1000));
    const col = BUBBLE_COLORS[ev.kind] || '#22c55e';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = hexA(col, 0.25*alpha); ctx.fill();
    ctx.strokeStyle = hexA(col, alpha); ctx.lineWidth = 1.5; ctx.stroke();
  });

  ctx.fillStyle = '#7D8590'; ctx.font = '10px Inter,sans-serif';
  if (vis.length) {
    ctx.fillText(new Date(vis[0].time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), padL, h-6);
    ctx.fillText(new Date(vis[vis.length-1].time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), w-padR-40, h-6);
  }
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}

function renderLevels() {
  const arr = Object.values(levels).filter(Boolean);
  const list = document.getElementById('levels-list');
  const count = document.getElementById('levels-count');
  let n = 0, html = '';
  for (const l of arr) {
    const col = WIN_COLOR[l.window] || '#fff';
    const rows = l.window === 'PS' ? [['PoC', l.poc]] : [['PoC', l.poc],['VaH', l.vah],['VaL', l.val]];
    for (const [name, p] of rows) {
      n++;
      html += `<div class="level-row"><span style="color:${col}">${l.window} ${name}</span><span>${Number(p).toFixed(2)}</span></div>`;
    }
  }
  count.textContent = n;
  list.innerHTML = html || '<div class="empty">Awaiting data…</div>';
  list.className = html ? '' : 'empty';
}

function addBubble(ev) {
  bubbles.push(ev);
  while (bubbles.length > MAX_BUBBLES) bubbles.shift();
  const list = document.getElementById('bubbles-list');
  const count = document.getElementById('bubbles-count');
  const rows = bubbles.slice().reverse().slice(0,40);
  list.className = '';
  list.innerHTML = rows.map(e => {
    const col = BUBBLE_COLORS[e.kind] || '#22c55e';
    const t = new Date(e.timestamp > 1e12 ? e.timestamp : e.timestamp*1000).toLocaleTimeString();
    return `<div class="bubble-row"><span style="color:${col};font-weight:600">${BUBBLE_LABEL[e.kind]||e.kind}</span><span style="color:var(--muted)">${Number(e.level).toFixed(2)} · ${t} · ${(e.exchange||'').toUpperCase()}</span></div>`;
  }).join('');
  count.textContent = bubbles.length;
}

function renderCalendar(data) {
  const events = Array.isArray(data) ? data : (data && data.events) || [];
  const list = document.getElementById('calendar-list');
  const count = document.getElementById('calendar-count');
  count.textContent = events.length;
  if (!events.length) { list.className='empty'; list.textContent='No events loaded'; return; }
  list.className = '';
  list.innerHTML = events.slice(0,12).map(e => {
    const impact = (e.impact||'low').toLowerCase();
    return `<div class="event-row" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between"><span>${e.time||''}</span><span class="event-impact impact-${impact}">${impact}</span></div>
      <div>${e.currency||''} · ${e.event||''}</div>
    </div>`;
  }).join('');
}

function chipClass(state, last) {
  const s = (state||'').toLowerCase();
  if (s.includes('error') || s.includes('disconnected')) return 'err';
  if (s === 'connected' || s === 'ok') {
    if (last && Date.now() - last > 120000) return 'warn';
    return 'ok';
  }
  if (s.includes('off')) return 'off';
  if (s.includes('start') || s.includes('retry')) return 'warn';
  return 'off';
}

function renderStatus(data) {
  feeds = (data && data.feeds) || feeds;
  const el = document.getElementById('chips');
  el.innerHTML = Object.entries(feeds).map(([name, f]) => {
    const stale = f.last_msg && Date.now() - f.last_msg > 120000;
    const cls = chipClass(f.state, f.last_msg);
    return `<span class="chip ${cls}">${name} ${f.state||''}${stale?' ⚠':''}</span>`;
  }).join('');
}

let ws, backoff = 1000, lastMsg = Date.now();
function wsUrl() {
  const u = new URL(BACKEND);
  u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
  u.pathname = '/ws'; u.search=''; u.hash='';
  return u.toString();
}
function connect() {
  try { ws = new WebSocket(wsUrl()); } catch(e) { schedule(); return; }
  document.getElementById('conn').textContent = 'connecting';
  ws.onopen = () => {
    backoff = 1000; lastMsg = Date.now();
    document.getElementById('conn').textContent = 'live';
    ws.send(JSON.stringify({ type:'subscribe', topics:['candle','levels','bubbles','trades','calendar','status'] }));
  };
  ws.onmessage = ev => {
    lastMsg = Date.now();
    let frame; try { frame = JSON.parse(ev.data); } catch { return; }
    switch (frame.type) {
      case 'heartbeat': break;
      case 'candle': upsertCandle(frame.data); draw(); break;
      case 'levels':
        if (frame.data && frame.data.window) { levels[frame.data.window] = frame.data; renderLevels(); draw(); }
        break;
      case 'bubbles': addBubble(frame.data); draw(); break;
      case 'calendar': renderCalendar(frame.data); break;
      case 'status': renderStatus(frame.data); break;
    }
  };
  ws.onclose = () => { document.getElementById('conn').textContent = 'reconnecting'; schedule(); };
  ws.onerror = () => { try { ws.close(); } catch(_){} };
}
function schedule() { setTimeout(connect, backoff); backoff = Math.min(backoff*2, 30000); }
setInterval(() => {
  if (Date.now() - lastMsg > 90000) {
    document.getElementById('conn').textContent = 'watchdog';
    try { ws && ws.close(); } catch(_){}
  }
}, 5000);

async function bootRest() {
  try {
    const r = await fetch(BACKEND + '/candles');
    if (r.ok) { const arr = await r.json(); arr.forEach(upsertCandle); draw(); }
  } catch(_){}
  try {
    const r = await fetch(BACKEND + '/levels');
    if (r.ok) { const arr = await r.json(); arr.forEach(l => { if (l.window) levels[l.window]=l; }); renderLevels(); draw(); }
  } catch(_){}
  try {
    const r = await fetch(BACKEND + '/status');
    if (r.ok) { const j = await r.json(); renderStatus(j.status || j); }
  } catch(_){}
}

bootRest();
connect();
resize();
setInterval(draw, 2000);
</script>
</body>
</html>
