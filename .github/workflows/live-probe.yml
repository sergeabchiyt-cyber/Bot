name: live-probe

# Records what the *deployed* engine is serving (REST payloads + a short
# WebSocket sample) into ci/live/, and a digest into ci/LIVE.md. Runs on a
# GitHub runner because the development sandbox cannot reach the Render host.
#
# Trigger: push a change to the probe scripts, or run it by hand from the
# Actions tab (workflow_dispatch) after a redeploy.

on:
  workflow_dispatch:
  push:
    paths:
      - "ci/live-probe.sh"
      - "ci/live_report.py"
      - "ci/ws_probe.py"
      - "ci/verify_contract.py"
      - "ci/c1_schema.py"
      - "contracts/**"
      - ".github/workflows/live-probe.yml"
      - "ci/diag_probe.py"

permissions:
  contents: write

concurrency:
  group: live-probe-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the deployed engine
        run: |
          python3 -m pip install --quiet websocket-client >/dev/null 2>&1 || true
          python3 ci/diag_probe.py /tmp/diag.md

      - name: Publish the snapshot to the branch
        run: |
          set -u
          git config user.email ci@example.invalid
          git config user.name ci
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            cp /tmp/diag.md ci/live/diag.md
            git add -f ci/live/diag.md
            if git diff --cached --quiet; then
              echo "no change since the last probe"
              exit 0
            fi
            git commit -m "ci: live engine diag [skip ci]"
            if git push origin "${{ github.ref_name }}"; then
              exit 0
            fi
            echo "push lost a race (attempt $attempt); retrying"
            sleep 5
          done
          echo "could not publish the probe snapshot" >&2
          exit 1

      - name: Step summary
        if: always()
        run: cat ci/LIVE.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
