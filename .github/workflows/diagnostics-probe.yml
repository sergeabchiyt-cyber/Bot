name: Diagnostics Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - "ci/diagnostics_probe.py"
      - ".github/workflows/diagnostics-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    name: Probe live & local Node 4 /diagnostics + /ws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "node4-execution -> target"

      - name: Build xauusd-node4-execution binary
        working-directory: node4-execution
        run: cargo build --bin xauusd-node4-execution

      - name: Install websockets
        run: pip install websockets

      - name: Run HTTP + WS diagnostics probe
        run: python3 ci/diagnostics_probe.py

      - name: Publish probe report to branch
        if: github.ref_name != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/DIAGNOSTICS-PROBE.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ci: record live and local /diagnostics HTTP + WS probe report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
