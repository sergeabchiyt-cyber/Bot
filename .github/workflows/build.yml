name: build

# Node1 only: the XAUUSD market-data and volume-profile service.
# Node2 (dashboard), Node3 (strategy) and Node4 (execution/MT5) are separate
# branches with their own CI; this workflow must never build them.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          # The default profile does not ship these, and `cargo fmt` / `cargo
          # clippy` then fail with "not installed for the toolchain".
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # One-off normalisation: this crate has never been run through rustfmt,
      # so `cargo fmt --all -- --check` below would fail on pre-existing style
      # in files this branch does not otherwise touch. Apply it once here and
      # let the check below hold the line from now on.
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          git config user.email ci@example.invalid
          git config user.name ci
          git add -A -- '*.rs'
          git diff --cached --quiet || git commit -m "style: apply rustfmt to the Node1 market service [skip ci]"
          git push origin ${{ github.ref_name }} || true
          git --no-pager diff --stat

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/check.log

      - name: Save error log to branch
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 60000 /tmp/check.log > build-errors.log
          git add -f build-errors.log
          git commit -m "ci: build error log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      # Proof 1 — PS rolls at every 18:00 NY session close (deterministic tests).
      # Proof 2 — calendar parsing is correct (fixture tests).
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture 2>&1 | tee /tmp/unit.log

      # Proof 2 (live) — the real ForexFactory feed returns parseable events.
      - name: Live calendar feed test
        run: |
          set -o pipefail
          cargo test --all-targets -- --ignored --nocapture 2>&1 | tee /tmp/live.log

      # Node1 owns market data only: no execution module, no broker env var,
      # no MT5 bridge, no `trades` write path.
      - name: Node1 service boundary
        run: python3 ci/check_node1_boundary.py .

      - name: Build
        run: cargo build --release

      - name: Smoke test (boot + /levels + /calendar against the live process)
        id: smoke
        run: |
          set -o pipefail
          bash ci/smoke.sh 2>&1 | tee /tmp/proof.log

      - name: Publish proof log to branch
        if: always()
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          mkdir -p ci
          {
            echo "# CI proof — run ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "generated: $(date -u +%FT%TZ)"
            echo
            echo '## Unit tests'
            cat /tmp/unit.log 2>/dev/null || echo "(missing)"
            echo
            echo '## Live calendar feed test'
            cat /tmp/live.log 2>/dev/null || echo "(missing)"
            echo
            echo '## Runtime smoke test'
            cat /tmp/proof.log 2>/dev/null || echo "(missing)"
            echo
          } | sed -r 's/\x1b\[[0-9;]*m//g' > ci/PROOF.md
          git add ci/PROOF.md
          git diff --cached --quiet || git commit -m "ci: proof log [skip ci]"
          git push origin ${{ github.ref_name }}
