name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2

      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/check.log

      - name: Save error log to branch
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 60000 /tmp/check.log > build-errors.log
          git add build-errors.log
          git commit -m "ci: build error log [skip ci]"
          git push origin ${{ github.ref_name }}

      # Proof 1 — PS rolls at every 17:00 NY session close (deterministic tests).
      # Proof 2 — calendar parsing is correct (fixture tests).
      - name: Unit tests
        run: cargo test --all-targets -- --nocapture

      # Proof 2 (live) — the real ForexFactory feed returns parseable events.
      - name: Live calendar feed test
        run: cargo test --all-targets -- --ignored --nocapture

      - name: Build
        run: cargo build --release

      - name: Smoke test (boot + /levels + /calendar against the live process)
        run: bash ci/smoke.sh
