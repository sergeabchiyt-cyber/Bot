name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node3-execution
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "node3-execution -> target"

      - name: Check
        run: cargo check --all-targets

      - name: Unit tests
        run: cargo test --all-targets -- --nocapture

      - name: Build release
        run: cargo build --release
