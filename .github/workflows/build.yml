name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/check.log
      - name: Emit errors as annotations
        if: failure() && steps.check.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re
          text = open('/tmp/check.log', encoding='utf-8', errors='replace').read()
          lines = text.splitlines()
          out, cur = [], None
          for line in lines:
              if line.startswith('error'):
                  cur = [line]; out.append(cur)
              elif cur is not None:
                  cur.append(line)
                  if len(cur) >= 9:
                      cur = None
          msg = '\n'.join(l for b in out[:12] for l in b)[:1200]
          print("::error::" + msg.replace('\n', '%0A').replace('\r', ''))
          PY
      - name: Build
        run: cargo build --release
      - name: Smoke test (boot + endpoints)
        run: |
          ./target/release/xauusd-engine &
          PID=$!
          sleep 4
          curl -sf http://127.0.0.1:3000/health && echo " <- /health ok"
          curl -sf http://127.0.0.1:3000/status && echo " <- /status ok"
          curl -sf http://127.0.0.1:3000/ | grep -q "ORDERFLOW" && echo " <- dashboard served"
          kill $PID
