name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/check.log
      - name: Save error log to branch
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 60000 /tmp/check.log > build-errors.log
          git add build-errors.log
          git commit -m "ci: build error log [skip ci]"
          git push origin ${{ github.ref_name }}
      - name: Build
        run: cargo build --release
      - name: Smoke test (boot + endpoints)
        run: |
          ./target/release/xauusd-engine &
          PID=$!
          sleep 4
          curl -sf http://127.0.0.1:3000/health && echo " <- /health ok"
          curl -sf http://127.0.0.1:3000/status && echo " <- /status ok"
          kill $PID
