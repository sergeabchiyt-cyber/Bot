name: build

# Node 1 only: the read-only XAUUSD market-data + calendar feed (contract C1 v2).
# Node 2 (dashboard), Node 3 (strategy/volume profile) and Node 4 (execution)
# are separate branches with their own CI; this workflow must never build them.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          # The default profile does not ship these, and `cargo fmt` /
          # `cargo clippy` then fail with "not installed for the toolchain".
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The C1 schema is byte-identical on all four branches; this fails if the
      # copy here drifts from the signed manifest.
      - name: Contract sync
        run: python3 ci/contract_sync.py

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/check.log

      - name: Save error log to branch
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 60000 /tmp/check.log > build-errors.log
          git add -f build-errors.log
          git commit -m "ci: build error log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      # Proof 1 — the tick validator drops bad prices, second-based timestamps,
      # future ticks and late ticks (deterministic unit tests).
      # Proof 2 — closed==true is emitted exactly once per bucket and the seq
      # counter is strictly increasing across topics (publish.rs tests).
      # Proof 3 — `closed == true` before the next bucket's first frame, replay
      # never carries a seq, gap on overrun, boot_id stable.
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture 2>&1 | tee /tmp/unit.log

      # Proof 4 (live) — the real ForexFactory feed returns parseable events.
      - name: Live calendar feed test
        run: |
          set -o pipefail
          cargo test --all-targets -- --ignored --nocapture 2>&1 | tee /tmp/live.log

      # Node 1 is a feed: it publishes bars, tick volume and the calendar, and
      # registers `get` handlers only. The guard below enforces that.
      - name: Node 1 service boundary
        run: python3 ci/check_node1_boundary.py .

      - name: Build
        run: cargo build --release

      - name: Smoke test (boot + 3 resolutions + /ws against the live process)
        id: smoke
        run: |
          set -o pipefail
          bash ci/smoke.sh 2>&1 | tee /tmp/proof.log

      - name: Publish proof log to branch
        if: always()
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          mkdir -p ci
          {
            echo "# CI proof — run ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "generated: $(date -u +%FT%TZ)"
            echo
            echo '## Unit tests'
            cat /tmp/unit.log 2>/dev/null || echo "(missing)"
            echo
            echo '## Live calendar feed test'
            cat /tmp/live.log 2>/dev/null || echo "(missing)"
            echo
            echo '## Runtime smoke test (C1 v2 contract matrix)'
            cat /tmp/proof.log 2>/dev/null || echo "(missing)"
            echo
            echo '## Clippy'
            cat /tmp/clippy.log 2>/dev/null || echo "(missing)"
            echo
          } | sed -r 's/\x1b\[[0-9;]*m//g' > ci/PROOF.md
          git add ci/PROOF.md
          git diff --cached --quiet || git commit -m "ci: proof log [skip ci]"
          git push origin ${{ github.ref_name }}
