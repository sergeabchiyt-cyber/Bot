name: build

# Node 4 is the only application in this repository: the execution service
# (`node4-execution`) plus its MT5 demo bridge (`mt5-bridge`), which runs next to
# the terminal and dials out to Node 4. There is no market-data engine or
# strategy crate here, so this workflow builds and tests exactly those two
# crates and lints the bridge's EA ⇄ bridge ⇄ Node 4 protocol.
#
# On failure the relevant log is pushed back to the branch so the error is
# readable without the Actions tab.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The execution service: check, fmt, clippy (-D warnings), tests, release.
  node4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node4-execution
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "node4-execution -> target"

      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/check.log

      - name: Save error log to branch
        if: failure() && steps.check.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 400000 /tmp/check.log > node4-errors.log
          git add -f node4-errors.log
          git commit -m "ci: node4 build error log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Format check
        id: fmt
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee /tmp/fmt.log

      - name: Save format log to branch
        if: failure() && steps.fmt.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 400000 /tmp/fmt.log > node4-fmt-errors.log
          git add -f node4-fmt-errors.log
          git commit -m "ci: node4 fmt log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      - name: Save clippy log to branch
        if: failure() && steps.clippy.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 400000 /tmp/clippy.log > node4-clippy-errors.log
          git add -f node4-clippy-errors.log
          git commit -m "ci: node4 clippy log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture 2>&1 | tee /tmp/unit.log

      - name: Save test log to branch
        if: failure() && steps.tests.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 400000 /tmp/unit.log > node4-test-errors.log
          git add -f node4-test-errors.log
          git commit -m "ci: node4 test log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Build release
        run: cargo build --release

  # The MT5 demo bridge runs on the terminal host, not on the Node 4 host, but it
  # is part of this service's execution surface and must keep compiling, passing
  # its fake-terminal contract tests, and agreeing with the EA protocol.
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mt5-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mt5-bridge -> target"

      - name: Protocol lint (EA ⇄ bridge ⇄ Node 4)
        working-directory: ${{ github.workspace }}
        run: python3 ci/mt5/protocol_lint.py

      - name: Check
        id: check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/bridge-check.log

      - name: Save error log to branch
        if: failure() && steps.check.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 400000 /tmp/bridge-check.log > mt5-bridge-errors.log
          git add -f mt5-bridge-errors.log
          git commit -m "ci: mt5-bridge build error log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Contract + unit tests
        id: tests
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture 2>&1 | tee /tmp/bridge-tests.log

      - name: Save test log to branch
        if: failure() && steps.tests.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          tail -c 400000 /tmp/bridge-tests.log > mt5-bridge-test-errors.log
          git add -f mt5-bridge-test-errors.log
          git commit -m "ci: mt5-bridge test log [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Build release
        run: cargo build --release
