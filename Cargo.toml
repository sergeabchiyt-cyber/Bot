[package]
name = "xauusd-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rill-ml = { version = "1.5", features = ["serde"] }
tokio-stream = "0.1"
dashmap = "6"
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"