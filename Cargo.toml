[package]
name = "xauusd-engine"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
anyhow = "1"
# CORS for the Node2 static frontend. 0.6 is the line that matches axum 0.8
# (both use the `http` 1.x types); tower-http 0.4 -> axum 0.6, 0.5 -> axum 0.7.
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# `ServiceExt::oneshot` — drives the router in unit tests without a socket.
tower = { version = "0.5", features = ["util"] }
